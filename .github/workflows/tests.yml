name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.13: the minimum. 3.14: the newest release.
        python: ["3.13", "3.14"]
        extras: ["dev"]
        include:
          # The optional extras too (xxhash hashing, the anthropic library), so they keep working.
          - os: ubuntu-latest
            python: "3.13"
            extras: "dev,all"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[${{ matrix.extras }}]"
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned, so a new ruff release with new rules can't turn CI red by itself. Settings: pyproject.toml.
      - run: python -m pip install "ruff==0.16.9"
      - run: ruff check .
      - name: Shell scripts parse
        run: |
          for f in "Setup Pettagam.command" "Uninstall Pettagam.command" launchers/Pettagam.command; do bash -n "$f"; done
          for f in launchers/*.sh; do sh -n "$f"; done

  package:
    # The wheel installs on its own and carries the panel page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp
          /tmp/v/bin/pettagam --version
          /tmp/v/bin/python -c "from importlib import resources; assert resources.files('pettagam').joinpath('panel.html').is_file()"
