[build-system]
requires = ["setuptools>=77"]  # 77: SPDX `license` and `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "pettagam"
dynamic = ["version"]  # from pettagam/__init__.py, so the two can't disagree
description = "Organize a messy file tree into a smart, type-based library"
readme = "README.md"
# 3.13 or newer (the owner's choice, 2026-10-22). The core needs nothing outside the standard library.
requires-python = ">=3.13"
authors = [{ name = "Jagadeesh" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["files", "organize", "photos", "deduplicate", "hardlink", "library", "nas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving",
    "Topic :: System :: Filesystems",
]
# The core is standard library only, by design (see docs/REQUIREMENTS.md, NFR-MAINT-1).
dependencies = []

[project.optional-dependencies]
# Faster duplicate checks on big libraries.
fast = ["xxhash>=3,<5"]
# AI tagging (pettagam tag). Needs an Anthropic API key.
ai = ["anthropic>=1,<3"]
all = ["pettagam[fast,ai]"]
dev = ["pytest>=7", "build>=1", "ruff>=0.16"]

[project.scripts]
pettagam = "pettagam.cli:main"

[project.urls]
Homepage = "https://github.com/javajaga-usa/Pettagam"
Changelog = "https://github.com/javajaga-usa/Pettagam/blob/main/CHANGELOG.md"
Issues = "https://github.com/javajaga-usa/Pettagam/issues"
Requirements = "https://github.com/javajaga-usa/Pettagam/blob/main/docs/REQUIREMENTS.md"

[tool.setuptools]
packages = ["pettagam"]

[tool.setuptools.dynamic]
version = { attr = "pettagam.__version__" }

[tool.setuptools.package-data]
pettagam = ["panel.html"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# pyflakes and pycodestyle errors, bugbear, modern syntax for 3.13, sorted imports.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
# Short local lambdas (q = lambda sql: ...) are the house style for one-line query helpers.
ignore = ["E731"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pettagam"]
known-local-folder = ["test_*", "conftest"]
